name: Preprocessing Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r preprocessing/requirements.txt

      - name: Check project structure
        run: |
          echo "=== ROOT ==="
          ls -la

          echo "=== PREPROCESSING ==="
          ls -la preprocessing

      - name: Run preprocessing
        run: |
          python preprocessing/preprocessing_gojek.py

      - name: Check processed data
        run: |
          echo "=== OUTPUT FILE ==="
          ls -lh preprocessing/processed_data.csv

          echo "=== GIT STATUS ==="
          git status --short

      - name: Commit processed data
        run: |
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config user.name "${{ secrets.GIT_USER_NAME }}"

          git add preprocessing/processed_data.csv

          git commit -m "Update processed data" || echo "No changes to commit"

          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
